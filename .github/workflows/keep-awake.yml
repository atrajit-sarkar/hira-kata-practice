# Keeps the free Render instance awake: Render pauses it after 15 minutes without visitors,
# and the next visitor then waits about a minute. Pinging the cheap health check every 5 minutes
# (GitHub may start scheduled runs a few minutes late) keeps it running.
# One always-on service uses at most 744 of Render's 750 free instance hours a month.
# A failed run means the site was unreachable; GitHub emails the repository owner.
name: Keep site awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # allows a manual run from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health check
        run: >
          curl --fail --silent --show-error
          --retry 3 --retry-delay 20 --retry-all-errors --max-time 90
          https://hirakata.onrender.com/api/health
